<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Out-of-district student share by school district, Aspen to Parachute</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link
      href="https://api.tiles.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      h2 {
        margin: 10px;
        font-size: 18px;
        text-align: left;
      }
      
      h3{
        margin: 10px;
        font-size: 13px;
        text-align: center;
      }

      p {
         line-height: 12px;
        font-size: 10px;
      }

      .map-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        margin-left: 20px;
        font-family: Arial, sans-serif;
        overflow: auto;
        border-radius: 3px;
        height: 100%;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      #features {
        top: 0;
        background: #fff;
        height: 10vh;
        margin-top: 20px;
        width: auto;

      }

      #legend {
        padding: 10px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 10%);
        line-height: 18px;
        height: auto;
        background: rgba(255, 255, 255, 0.8);
        margin-right: 10px;
        margin-bottom: 80px;
        width: 200px;
        font-size: 13px;
        right: 0;
        display: block;
        justify-content: space-between;
      }
      
      .legend-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
      }
      
      .gradient {
        width: 100%;
        height: 12px;
        opacity: 0.8;
        background: linear-gradient(to right,
        #fdd963 0%,
        #fb9a09 10%,
        #d80303 50%,
        #6f020e 100%);
      }

      .gradient-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 3px;
      }

      #legend-circles {
        display: flex;
        flex-direction: column;
        font-size: 12px;
      }
      
      #note{
        padding: 5px;
        line-height: 14px;
        height: auto;
        margin-left: 20px;
        margin-bottom: 25px;
        width: 300px;
        font-size: 13px;
        left: 0;
        color: #ffff;
        text-shadow: 1px 1px 2px #000000; 
 }
      .legend-key {
        display: inline-block;
        border-radius: 20%;
        width: 10px;
        height: 10px;
        margin-right: 5px;
        opacity: 0.8;
        border: 1px solid white;
        
      }
      
     .legend-key.circle {
      border-radius: 50%;
    }
    
      .mapboxgl-popup-content {
      font-size: 12px;
      padding: 8px;
      width: auto;
      max-width: none;
     white-space: nowrap;
    }
      
      @media (max-width: 615px) {
        #features {
        height: 14vh;}
}
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="map-overlay" id="features">
      <h2><center>Out-of-district student share by school district, Aspen to Parachute</center></h2>
      <h3><i>2025-26 school year</i></h3>
    </div>
<!--
     <div class="map-overlay" id="legend">
    
        <div id="legend-rects"></div>
        <div id="legend-circles"></div>
       </div>
-->
    
          
      <div class="map-overlay" id="legend">
        <div class="legend-title">Out-of-district students in the district (%)</div>
        <div class="gradient"></div>
      <div class="gradient-labels">
    <span>1%</span>
    <span>20%</span>
      </div>

        <div id="legend-circles"></div>
      </div>

    <div class="map-overlay" id="note"><p>Source: CDE <br>Credit: Laurine Lassalle - Aspen Journalism</p></div>
    
    <script>
      // define access token
      mapboxgl.accessToken = 'pk.eyJ1IjoibGF1cmluZS1haiIsImEiOiJja3ByZDBnYjMwNGYzMnZwbWhmMGJrcTZhIn0.xZkfTBy8vho1jNUvbxRMMg';

      const isMobile = window.innerWidth < 600;
      // create map
      const map = new mapboxgl.Map({
        container: 'map', // container id
        style: 'mapbox://styles/laurine-aj/cmu306x46002v01sj58zq95mc' ,
        center: isMobile ? [-107.3, 39.35] : [-107.4, 39.47],
        zoom: isMobile ? 7 : 8.2
      });

    map.on('load', () => {
  map.getCanvas().style.cursor = 'default';

      // Add legend
      
      
//      const layers = [
//        { name: '1% of the students', color: '#fdd963', shape: 'rect' },
//        { name: 'Garfield RE-2 school district (2% of the students)', color: '#fb9a09', shape: 'rect' },
//        { name: 'Roaring Fork RE-1 school district (10% of the students)', color: '#d80303', shape: 'rect' },
//        { name: 'Aspen 1 school district (20% of the students)', color: '#6f020e', shape: 'rect' },
//        
        
       const layers = [
  { name: 'Garfield 16 schools', color: '#004d40', shape: 'circle' },
  { name: 'Garfield RE-2 schools', color: '#da1b61', shape: 'circle' },
  { name: 'Roaring Fork schools', color: '#066ab7', shape: 'circle' },
  { name: 'Aspen schools', color: '#f3cf30', shape: 'circle' }
];
//      
//      const legendRects = document.getElementById('legend-rects');
      const legendCircles = document.getElementById('legend-circles');

layers.forEach(layer => {
  const item = document.createElement('div');
  const key = document.createElement('span');
  key.className = 'legend-key';
  if (layer.shape === 'circle') key.classList.add('circle');
  key.style.backgroundColor = layer.color;

  const value = document.createElement('span');
  value.innerHTML = `${layer.name}`;
  item.appendChild(key);
  item.appendChild(value);

  legendCircles.appendChild(item);
});
      const popup = new mapboxgl.Popup({
  closeButton: false,
  closeOnClick: false
});
      
map.on('mousemove', 'cdphe-cdoe-school-locations-and-district-office-locations-2', (e) => {
  if (!e.features.length) return;

  map.getCanvas().style.cursor = 'pointer'; // change cursor on hover

  const feature = e.features[0];
  const schoolName = feature.properties.School_Name;

  popup
    .setLngLat(e.lngLat)
    .setHTML(`<strong>${schoolName}</strong>`)
    .addTo(map);
});
      
      map.on('mouseleave', 'cdphe-cdoe-school-locations-and-district-office-locations-2', () => {
  map.getCanvas().style.cursor = '';
  popup.remove();
});
      
            });
    </script>
   
  </body>
</html>
